<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B2B" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Blood Drop Shape -->
  <path d="M50 8 C50 8 16 48 16 68 C16 86 31 96 50 96 C69 96 84 86 84 68 C84 48 50 8 50 8 Z" fill="url(#dropGrad)" filter="url(#glow)"/>
  
  <!-- Bridge Arch Structure inside -->
  <path d="M30 75 Q 50 55 70 75" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M26 80 L 74 80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="71" x2="38" y2="80" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="50" y1="65" x2="50" y2="80" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="62" y1="71" x2="62" y2="80" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Human connection symbols at bridge crest -->
  <circle cx="45" cy="46" r="3" fill="#FFFFFF"/>
  <circle cx="55" cy="46" r="3" fill="#FF2B2B" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M41 54 C41 50 49 50 49 54" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
  <path d="M51 54 C51 50 59 50 59 54" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
</svg>